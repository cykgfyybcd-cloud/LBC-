<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LBC La Cave Privée</title>
<meta name="theme-color" content="#06180f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="LBC Cave">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@300;400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Palette du logo : rouge cire, cuivre, vert très sombre, crème */
:root{--bg:#F2EAE0;--bg2:#E7DAC9;--card:#FAF6F0;--tx:#14201a;--mu:#6b5f52;--ln:#D6C5AE;--ac:#7d1022;--gold:#a8692f;--cork:#C2A07A;--stage:#C2A07A;--vert:#06180f;--btn:#7d1022;--on-btn:#F6EBCB;--s-cons:#56666e;--s-surv:#8d6a1c;--s-boire:#2f6b4f;--s-pleine:#7d1022;--s-apres:#9a4529;--s-nd:#7a725f;--serif:"EB Garamond","Cormorant Garamond",Garamond,"Times New Roman",serif;--sans:"Hanken Grotesk",-apple-system,"Helvetica Neue",Arial,sans-serif;--paper:none;--wood:none;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06160e;--bg2:#0c2418;--card:#0e281b;--tx:#F4E8C8;--mu:#a9b39c;--ln:#1f3d2d;--ac:#D9985A;--gold:#C98A4B;--btn:#8C1224;--on-btn:#F6EBCB;--s-cons:#9fb2ba;--s-surv:#d4ae5c;--s-boire:#7fc19c;--s-pleine:#e8a0a8;--s-apres:#e8906f;--s-nd:#9a927f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#06160e;--bg2:#0c2418;--card:#0e281b;--tx:#F4E8C8;--mu:#a9b39c;--ln:#1f3d2d;--ac:#D9985A;--gold:#C98A4B;--btn:#8C1224;--on-btn:#F6EBCB;--s-cons:#9fb2ba;--s-surv:#d4ae5c;--s-boire:#7fc19c;--s-pleine:#e8a0a8;--s-apres:#e8906f;--s-nd:#9a927f;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:400 16px/1.5 var(--sans);font-variant-numeric:lining-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;background-image:var(--paper);opacity:.55;pointer-events:none;z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{position:relative;z-index:1;min-height:100vh}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,3.6vw,46px);line-height:1.1;letter-spacing:.07em;text-transform:uppercase;font-weight:500}
h2{font-size:32px;line-height:1.1}
h3{font-size:22px;line-height:1.2}
p{margin:0}
.sub{color:var(--mu);margin-top:6px}
.wrap{max-width:1380px;margin:0 auto;padding-block:28px 80px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.view{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nr{color:var(--mu);font-style:italic;font-size:14px}
/* barre haute */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--ln)}
.top-in{max-width:1380px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px max(24px,env(safe-area-inset-right,0px)) 10px max(24px,env(safe-area-inset-left,0px))}
.sealbtn{background:none;border:0;padding:0;flex:none;line-height:0;border-radius:50%}.seal{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 3px 5px #0005)}
.brand{line-height:1.1;white-space:nowrap}.brand b{display:block;font:500 17px var(--serif)}.brand span{font-size:12px;letter-spacing:.16em;color:var(--mu);text-transform:uppercase}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:14px 14px;font:500 15px var(--sans);color:var(--mu);white-space:nowrap;min-height:48px}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
.top .gs{width:210px;flex:none;padding:11px 14px;border:1px solid var(--ln);background:var(--card);border-radius:2px}
.tbtn{background:none;border:1px solid var(--ln);width:44px;height:44px;border-radius:50%;font-size:15px}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 24px;border:1px solid var(--btn);background:var(--btn);color:var(--on-btn);border-radius:2px;font:500 15px var(--sans);letter-spacing:.04em;transition:background .3s,color .3s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--gold)}.btn.ghost:hover{background:var(--bg2);filter:none}
.btn.danger{background:transparent;color:var(--s-apres);border-color:var(--s-apres)}
.btn.sm{min-height:40px;padding:8px 16px;font-size:14px}
.btn.big{padding:16px 34px;letter-spacing:.14em;text-transform:uppercase;font-size:14px}
.lk{background:none;border:0;padding:0;color:var(--ac);text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.seg{display:inline-flex;border:1px solid var(--gold);border-radius:2px;overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;padding:11px 18px;min-height:44px;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--btn);color:var(--on-btn)}
.tag{display:inline-block;font-size:12px;letter-spacing:.04em;padding:3px 10px;border:1px solid var(--c,var(--ln));color:var(--c,var(--mu));border-radius:99px;white-space:nowrap}
.fic{position:absolute;top:10px;left:10px;font-size:11px;letter-spacing:.06em;padding:3px 9px;background:var(--bg);color:var(--mu);border:1px dashed var(--mu)}
/* filtres */
.filters{border:1px solid var(--ln);background:var(--card);margin:18px 0 22px}
.filters summary{padding:14px 18px;cursor:pointer;font-weight:500;min-height:48px;display:flex;align-items:center}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:6px 18px 18px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}.fld.wide{grid-column:1/-1}
.fld label{font-size:13px;color:var(--mu)}
input[type=text],input[type=date],input[type=search],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--ln);background:var(--bg);border-radius:2px;min-height:46px}
textarea{resize:vertical}
/* galerie */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:22px}
.tile{cursor:pointer;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--ln);transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s}
.tile:hover{transform:translateY(-4px);box-shadow:0 18px 30px -22px #000a}
.tv{position:relative;height:290px;background:var(--stage);display:grid;place-items:center;overflow:hidden}
.tv .bt{height:84%;width:auto;filter:drop-shadow(0 14px 10px #0007)}
.tv img.ph{width:100%;height:100%;object-fit:cover}
.tb{padding:16px 16px 18px;display:flex;flex-direction:column;gap:3px}
.tb h3{font-size:19px}.tb .cu{font-style:italic;color:var(--mu);font-size:14px;min-height:20px}.tb .ap{font-size:14px}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mu);margin:8px 0 6px;border-top:1px solid var(--ln);padding-top:8px}
/* bibliothèque */
.reg{margin-bottom:34px}.reg h2{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}.reg h2 small{font:400 14px var(--sans);color:var(--mu)}
.rack{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end;padding:20px 26px 0;background:var(--bg2);border:1px solid var(--ln);border-bottom:0;min-height:260px}
.board{height:26px;background-color:#3b2517;background-image:var(--wood);box-shadow:0 10px 14px -8px #0008;margin-bottom:6px}
.spine{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;margin-bottom:-4px;transition:transform .5s}
.spine:hover{transform:translateY(-8px)}.spine .bt{height:230px;width:auto;filter:drop-shadow(0 8px 6px #0006)}.spine small{font-size:12px;color:var(--mu);background:var(--bg2);padding-bottom:6px}.spine em{position:absolute;top:-6px;right:-8px;font:600 12px var(--sans);background:var(--btn);color:var(--on-btn);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-style:normal}
/* liste */
.lt{width:100%;border-collapse:collapse}.lt th{font:500 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-align:left;padding:8px 10px;border-bottom:1px solid var(--gold)}
.lt td{padding:14px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}.lt tr[data-act]{cursor:pointer}.lt tr[data-act]:hover td{background:var(--bg2)}
.lt .yr{font:500 26px var(--serif);color:var(--ac)}.lt .r{text-align:right;font-variant-numeric:tabular-nums}.lt td small{display:block;color:var(--mu)}
.tw{overflow-x:auto}
.vint{display:grid;grid-template-columns:130px 1fr;gap:22px;padding:18px 0;border-top:1px solid var(--gold)}.vint .y{font:500 56px/1 var(--serif);color:var(--ac)}.vint .items{display:flex;flex-wrap:wrap;gap:14px}
.mini{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--ln);padding:10px 14px 10px 10px;cursor:pointer;min-height:64px}.mini .bt{height:60px;width:auto}.mini b{font:500 16px var(--serif);display:block}.mini span{font-size:13px;color:var(--mu)}
.vbar{height:6px;background:var(--bg2);margin-top:6px}.vbar i{display:block;height:100%;background:var(--ac)}
/* passeport */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;transform:translateY(100%);visibility:hidden;transition:transform .55s cubic-bezier(.2,.7,.2,1),visibility 0s .55s}
.sheet.on{transform:none;visibility:visible;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.pp{position:relative;display:grid;grid-template-columns:minmax(300px,40%) 1fr;min-height:100%}
.ppl{background:var(--stage);padding:max(70px,calc(env(safe-area-inset-top,0px) + 56px)) 28px 40px;display:flex;flex-direction:column;align-items:center;gap:18px;position:sticky;top:0;height:100vh;color:#252525}
.stage{position:relative;flex:1;min-height:340px;width:100%;display:grid;place-items:center;min-height:0}
.stage .bt{height:92%;width:auto;filter:drop-shadow(0 22px 16px #0008)}.stage img.ph{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 18px 30px -12px #0008}
.ppr{padding:max(48px,calc(env(safe-area-inset-top,0px) + 40px)) max(40px,env(safe-area-inset-right,0px)) 140px 48px;max-width:860px}
.ppr h1{margin:8px 0 4px;text-transform:none;letter-spacing:0;font-size:clamp(34px,4vw,52px)}.cuv{font:italic 400 22px var(--serif);color:var(--mu)}.appn{font-size:18px;margin-top:8px}.appn b{font:500 30px var(--serif);color:var(--ac);margin-left:8px}
.x{position:fixed;top:max(14px,env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));z-index:5;background:var(--bg);border:1px solid var(--gold);padding:10px 20px;min-height:44px;border-radius:2px}
.ppr section{margin-top:34px}.ppr h4{font-size:22px;border-bottom:1px solid var(--gold);padding-bottom:8px;margin-bottom:6px}
dl{margin:0}dl>div{display:grid;grid-template-columns:200px 1fr;gap:14px;padding:9px 0;border-bottom:1px solid var(--ln)}dt{color:var(--mu);font-size:14px}dd{margin:0;min-width:0;overflow-wrap:anywhere}
dd .src{display:block;font-size:12.5px;color:var(--mu)}
.note{font-size:13.5px;color:var(--mu);margin-top:10px;font-style:italic}
.actions{position:fixed;left:40%;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--gold);padding:14px max(40px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) 48px;display:flex;gap:10px;flex-wrap:wrap;z-index:4}
.gb{position:relative;height:34px;margin:18px 0 8px;background:var(--bg2)}.gb .w{position:absolute;top:0;bottom:0;background:var(--s-boire);opacity:.55}.gb .pk{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--ac)}.gb .nw{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--tx)}.gb small{position:absolute;top:38px;font-size:12px;color:var(--mu);transform:translateX(-50%);white-space:nowrap}
.lst{margin:6px 0 0;padding-left:18px}.lst li{margin:4px 0}.subh{font:600 13px var(--sans);color:var(--mu);margin-top:12px;letter-spacing:.04em}
/* modales */
.modal{position:fixed;inset:0;z-index:70;background:#0b0a09cc;display:none;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 40px}.modal.on{display:block}
.mbox{max-width:860px;margin:0 auto;background:var(--bg);border:1px solid var(--gold);padding:28px max(26px,env(safe-area-inset-right,0px)) 26px 28px;animation:fade .4s both}
.mbox h2{margin-bottom:16px}.mbox fieldset{border:0;padding:0;margin:0 0 22px}.mbox legend{font:500 21px var(--serif);padding:0 0 8px;border-bottom:1px solid var(--ln);width:100%;margin-bottom:12px;color:var(--ac)}
.fg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px;position:sticky;bottom:0;background:var(--bg);padding:12px 0}
.toast{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--vert);color:#F0E9DC;border:1px solid var(--gold);padding:12px 22px;z-index:90;opacity:0;pointer-events:none;transition:.4s;max-width:90vw}.toast.on{opacity:1;transform:translate(-50%,0)}
.cam{border:1px dashed var(--gold);padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:22px;background:var(--card)}.cam img{height:120px;border:1px solid var(--ln)}
.banner{border:1px solid var(--s-surv);padding:12px 16px;margin-bottom:16px;background:var(--card)}
/* valeur */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);margin-bottom:30px}
.kpis>div{padding:20px 18px}.kpis>div+div{border-left:1px solid var(--ln)}.kpis small{display:block;color:var(--mu);font-size:13px}.kpis b{font:500 clamp(28px,3vw,40px)/1.15 var(--serif);font-variant-numeric:tabular-nums}.pos{color:var(--s-boire)}.neg{color:var(--s-apres)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:34px;margin-bottom:32px}
.bars>div{display:grid;grid-template-columns:150px 1fr 90px;gap:12px;align-items:center;padding:7px 0;font-size:14.5px}.bars .bb{height:8px;background:var(--bg2)}.bars .bb i{display:block;height:100%;background:var(--ac)}.bars span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.chart text{fill:var(--mu);font:12px var(--sans)}
.sec{margin-bottom:34px}.sec>h2{margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--gold)}
.card{background:var(--card);border:1px solid var(--ln);padding:18px 20px}
/* calendrier */
.years{display:flex;gap:0;overflow-x:auto;border:1px solid var(--ln);margin-bottom:24px}.years button{flex:none;min-width:82px;background:none;border:0;border-right:1px solid var(--ln);padding:12px 8px;min-height:64px;text-align:center}.years button b{display:block;font:500 20px var(--serif)}.years button small{font-size:12px;color:var(--mu)}.years button.on{background:var(--btn);color:var(--on-btn)}.years button.on small{color:inherit}.years button.cur b{text-decoration:underline;text-underline-offset:4px}
.stat{margin-bottom:20px}.stat h3{display:flex;gap:10px;align-items:center;margin-bottom:8px}.stat h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.chip{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--ln);background:var(--card);padding:6px 6px 6px 14px;margin:0 8px 8px 0;min-height:46px}.chip button{min-height:34px}
.gantt{border-collapse:collapse;font-size:13px}.gantt th,.gantt td{padding:0;border:1px solid var(--bg)}.gantt th{font:500 12px var(--sans);color:var(--mu);min-width:34px;height:30px}.gantt td.n{position:sticky;left:0;background:var(--bg);padding:6px 14px 6px 0;min-width:230px;max-width:260px;cursor:pointer}.gantt td i{display:block;height:28px;background:var(--c);opacity:.78}.gantt th.cur,.gantt td.cur{box-shadow:inset 2px 0 var(--tx),inset -2px 0 var(--tx)}
/* journal */
.entry{display:grid;grid-template-columns:110px 1fr auto;gap:24px;padding:22px 0;border-top:1px solid var(--gold);cursor:pointer}.entry .d b{display:block;font:500 46px/1 var(--serif);color:var(--ac)}.entry .d span{color:var(--mu);font-size:14px}.entry h3{margin-bottom:4px}.entry p{color:var(--mu);margin-top:4px}.score{font:500 34px var(--serif);color:var(--ac);text-align:right}.score small{display:block;font:400 12px var(--sans);color:var(--mu)}
.ph-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.ph-row img{height:150px;border:1px solid var(--ln);cursor:zoom-in}
/* chasseur */
.hunt{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px}.hcard{background:var(--card);border:1px solid var(--ln);padding:22px;display:flex;flex-direction:column;gap:10px;cursor:pointer}.verdict{padding:12px 14px;border-left:4px solid var(--c);background:var(--bg2);font-size:14.5px}.verdict b{display:block;font:500 20px var(--serif);color:var(--c)}
.hcard dl>div{grid-template-columns:150px 1fr;padding:6px 0;font-size:14.5px}
/* studio */
.studio{display:grid;grid-template-columns:320px 1fr;gap:34px}.studio aside{display:flex;flex-direction:column;gap:16px}.tpl{display:flex;flex-direction:column;gap:6px}.tpl button{text-align:left;background:none;border:1px solid var(--ln);padding:12px 14px;min-height:50px}.tpl button.on{border-color:var(--ac);background:var(--card)}.tpl small{display:block;color:var(--mu)}
.outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;align-content:start}.out img{width:100%;display:block;border:1px solid var(--ln);box-shadow:0 14px 24px -16px #000a}.out .row{margin-top:8px}
/* sommelier */
.chat{display:flex;flex-direction:column;gap:18px;min-height:340px;margin-bottom:20px}.msg{max-width:78ch;padding:16px 20px;border:1px solid var(--ln);background:var(--card)}.msg.me{align-self:flex-end;background:var(--btn);color:var(--on-btn);border-color:var(--btn)}.msg b{font-weight:600}.msg p+p{margin-top:8px}.ask{position:sticky;bottom:0;background:var(--bg);padding:12px 0 max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:10px}.ask input{flex:1}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.sugg button{background:var(--card);border:1px solid var(--ln);padding:10px 16px;min-height:44px;border-radius:99px;font-size:14px}
/* accueil */
.landing{position:fixed;inset:0;z-index:80;background:#06180f;color:#F4E8C8;display:grid;grid-template-rows:auto 1fr auto;overflow:auto;padding:max(26px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-right,0px)) max(26px,env(safe-area-inset-bottom,0px)) max(40px,env(safe-area-inset-left,0px));transition:transform 1s cubic-bezier(.65,0,.25,1)}
.landing::before{content:"";position:absolute;inset:0;background-image:var(--paper);opacity:.7;pointer-events:none}
.landing>*{position:relative}.landing.leave{transform:translateY(-104%)}
.lhead{display:flex;align-items:center;gap:22px}.lhead .seal{width:96px;height:96px;filter:drop-shadow(0 6px 10px #0009)}.lhead h1{font-size:clamp(20px,2.4vw,28px);letter-spacing:.2em;font-weight:500}.lhead p{letter-spacing:.34em;font-size:12px;color:#C98A4B;margin-top:6px}.ldate{margin-left:auto;font:italic 400 clamp(16px,1.8vw,22px) var(--serif);color:#cbbd9f;text-align:right}
.lmid{display:grid;place-items:center;padding:10px 0;min-height:0}.shelf{width:min(100%,1060px);max-height:56vh}
.dash{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid #C98A4B66;margin-top:6px}.dash>div{padding:16px 14px 6px}.dash>div+div{border-left:1px solid #C98A4B44}.dash small{display:block;font-size:12.5px;color:#b9ad92}.dash b{font:500 clamp(24px,2.8vw,36px)/1.2 var(--serif);font-variant-numeric:tabular-nums}.dash em{display:block;font-style:normal;font-size:12px;color:#b9ad92}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:18px}.lfoot p{font:italic 400 17px var(--serif);color:#b9ad92}
.enter{background:transparent;color:#F4E8C8;border:1px solid #C98A4B;padding:18px 46px;letter-spacing:.3em;font:500 13px var(--sans);text-transform:uppercase;min-height:56px;transition:background .5s,color .5s}.enter:hover{background:#C98A4B;color:#06180f}
.bt{display:block}
@media(max-width:900px){.pp{grid-template-columns:1fr}.ppl{position:relative;height:auto;min-height:420px}.actions{left:0;padding-left:16px}.ppr{padding:30px 20px 140px}dl>div{grid-template-columns:1fr}.studio{grid-template-columns:1fr}.dash{grid-template-columns:repeat(2,1fr)}.dash>div:nth-child(odd){border-left:0}.gs{display:none}.vint{grid-template-columns:1fr}.entry{grid-template-columns:80px 1fr}.entry .score{display:none}.bars>div{grid-template-columns:100px 1fr 70px}.brand span{display:none}}

/* inspirations Vivino / Oeni : pastilles de filtre, note, jauge de garde, barre d'onglets mobile */
.qf{display:flex;gap:8px;overflow-x:auto;margin:18px 0 0;padding-bottom:4px;scrollbar-width:none}.qf::-webkit-scrollbar{display:none}
.qf button{flex:none;border:1px solid var(--ln);background:var(--card);padding:9px 18px;min-height:44px;border-radius:99px;font-size:14.5px}.qf button.on{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.sbar{display:none;width:100%;margin-top:16px}

.tv .score{text-align:center}
.gauge{position:relative;height:5px;background:var(--bg2);margin:10px 0 3px}.gauge i{position:absolute;top:0;bottom:0;opacity:.8}.gauge b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tx)}.gl{font-size:12px;color:var(--mu)}

.btabs{display:none}
@media(max-width:900px){
 .top .tabs,.top .gs{display:none}.sbar{display:block}.top-in{gap:12px}.brand b{font-size:19px}
 .btabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--ln);padding:6px max(8px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}

 .wrap{padding-bottom:110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-width:0}.seg{display:flex;flex-wrap:nowrap;overflow-x:auto;max-width:100%}.seg button{white-space:nowrap}.btn.big{width:100%}.tv{height:210px}.tb{padding:12px}.tb h3{font-size:18px}

/* ===== Version bulles : tout est arrondi, doux, tactile ===== */
:root{--r:22px;--r2:14px}
.btn{border-radius:99px;padding-inline:26px}
.btn.big,.enter{border-radius:99px}
.seg{border:0;background:var(--bg2);border-radius:99px;padding:4px;gap:2px;overflow:visible}
.seg button{border-radius:99px;padding:10px 18px;min-height:42px;transition:background .25s,color .25s}
.seg button.on{box-shadow:0 4px 10px -4px #0006}
.tabs{gap:6px;padding:4px 0}
.tabs button{border:0;border-radius:99px;padding:10px 18px;min-height:44px;transition:background .25s,color .25s}
.tabs button:hover{background:var(--bg2)}
.tabs button.on{background:var(--btn);color:var(--on-btn);border:0}
.top .gs,input[type=search]{border-radius:99px;padding-inline:18px}
input[type=text],input[type=date],input[type=number],select,textarea{border-radius:var(--r2)}
.card,.filters,.tile,.dash,.entry,.mbox,.sec{border-radius:var(--r)}
.filters{overflow:hidden}.filters summary{padding-inline:22px}
.tile{overflow:hidden}
.tile .tv,.tv{border-radius:var(--r) var(--r) 0 0}
.mbox{border-radius:28px;border-color:var(--ln)}
.stage{border-radius:28px}
.ppl{border-radius:0 0 34px 0}
.ppr section{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:20px 24px 14px}
.ppr h4{border-bottom:0;font-size:20px;padding-bottom:2px}
.actions{border-radius:26px 26px 0 0}
.entry{background:var(--card);border:1px solid var(--ln);border-top:1px solid var(--ln);padding:20px 24px;margin-bottom:12px;transition:transform .3s,box-shadow .3s}
.entry:hover{transform:translateY(-2px);box-shadow:0 14px 26px -20px #000a}
.tag,.pill{border-radius:99px}
.btabs{border-radius:26px 26px 0 0}
.btabs button{border-radius:99px}
.qf button{border-radius:99px}
.gauge,.gauge i{border-radius:99px}
.note{border-radius:var(--r2)}
.landing .dash{border:1px solid #C98A4B44;border-radius:var(--r);overflow:hidden}

/* pastilles de choix (verdict, accords...) */
.bub{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--gold);background:var(--card);color:var(--tx);padding:10px 18px;min-height:44px;font:500 14.5px var(--sans);cursor:pointer;transition:background .25s,color .25s,transform .2s}
.pill:active{transform:scale(.97)}
.pill.on{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.pill.yes.on{background:#2f6b44;border-color:#2f6b44;color:#fff}
.pill.no.on{background:#8a2a2a;border-color:#8a2a2a;color:#fff}
.vd{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:99px;font:500 14px var(--sans);border:1px solid var(--ln);background:var(--bg2);color:var(--tx);white-space:nowrap}
.vd.yes{background:#2f6b4422;border-color:#2f6b44;color:#2f6b44}.vd.no{background:#8a2a2a22;border-color:#8a2a2a;color:#8a2a2a}.vd.mid{background:#C98A4B22;border-color:var(--gold);color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vd.yes{color:#7fcf9a;border-color:#7fcf9a}:root:not([data-theme="light"]) .vd.no{color:#f0908a;border-color:#f0908a}}
:root[data-theme="dark"] .vd.yes{color:#7fcf9a;border-color:#7fcf9a}:root[data-theme="dark"] .vd.no{color:#f0908a;border-color:#f0908a}
.avis{margin-top:22px;background:var(--card);border:1px solid var(--gold);border-radius:var(--r);padding:20px 24px;display:grid;gap:10px}

.tsec{display:grid;gap:10px;margin-top:10px}
.tmini{display:flex;gap:14px;align-items:center;padding:14px 18px;border:1px solid var(--ln);border-radius:var(--r2);background:var(--bg);cursor:pointer}

.subtle{font:500 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:22px 0 8px;grid-column:1/-1}

.stage{overflow:hidden}

.phbg{position:absolute;left:-24px;top:-24px;width:calc(100% + 48px);height:calc(100% + 48px);max-width:none;object-fit:cover;filter:blur(24px) saturate(1.15) brightness(.82);z-index:0;pointer-events:none}

.stage:has(.phf){background:#2a2018}

.tv:has(.phf){background:#2a2018}
.fic,.score,.tv .score{z-index:3}

/* ---------- collection ---------- */
const CF={view:'gal',q:'',region:'',appellation:'',domaine:'',millesime:'',couleur:'',mat:'',pmin:'',pmax:'',qmin:''};
const uniq=k=>[...new Set(S.bottles.map(b=>b[k]).filter(x=>x!=null&&x!==''))].sort((a,b)=>String(a).localeCompare(String(b),'fr'));
const sel=(k,l,opts,lab)=>`<div class="fld"><label for="cf_${k}">${l}</label><select id="cf_${k}" data-in="cf" data-k="${k}"><option value="">Tous</option>${opts.map(o=>{const v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return`<option value="${esc(v)}" ${String(CF[k])===String(v)?'selected':''}>${esc(t)}</option>`}).join('')}</select></div>`;
function vCollection(){return `<div class="wrap"><div id="rem"></div><div class="head"><div><h1>Ma collection</h1><p class="sub" id="ccount"></p></div><div class="row"><button class="btn" data-act="add">Ajouter une bouteille</button></div></div>
<div class="seg" role="tablist">${[['gal','Galerie'],['reg','Par région'],['list','Liste'],['mil','Par millésime'],['val','Par valeur']].map(([k,l])=>`<button data-act="cview" data-k="${k}" class="${CF.view===k?'on':''}">${l}</button>`).join('')}</div>
<input class="sbar" type="search" placeholder="Rechercher une bouteille" data-in="gsearch" data-ev="input" value="${esc(CF.q)}" aria-label="Recherche">
<div class="qf">${[['','Toutes',''],['couleur:rouge','Rouges'],['couleur:blanc','Blancs'],['couleur:rosé','Rosés'],['couleur:effervescent','Effervescents'],['couleur:liquoreux','Liquoreux'],['mat:boire','À boire']].map(([k,l])=>{const [a,v]=k.split(':'),on=!k?(!CF.couleur&&!CF.mat):a==='couleur'?CF.couleur===v:CF.mat==='pleine'||CF.mat==='boire';return`<button data-act="qf" data-k="${k}" class="${on?'on':''}">${l}</button>`}).join('')}</div>
<details class="filters" ${CF.region||CF.appellation||CF.domaine||CF.millesime||CF.couleur||CF.mat||CF.pmin||CF.pmax||CF.qmin?'open':''}><summary>Filtres</summary><div class="fgrid">${sel('region','Région',uniq('region'))}${sel('appellation','Appellation',uniq('appellation'))}${sel('domaine','Domaine',uniq('domaine'))}${sel('millesime','Millésime',uniq('millesime'))}${sel('couleur','Couleur',COUL)}${sel('mat','Maturité',Object.keys(MAT).map(k=>[k,MAT[k][0]]))}
<div class="fld"><label for="cf_pmin">Prix d’achat min. (€)</label><input id="cf_pmin" type="text" inputmode="decimal" data-in="cf" data-ev="input" data-k="pmin" value="${esc(CF.pmin)}"></div><div class="fld"><label for="cf_pmax">Prix d’achat max. (€)</label><input id="cf_pmax" type="text" inputmode="decimal" data-in="cf" data-ev="input" data-k="pmax" value="${esc(CF.pmax)}"></div><div class="fld"><label for="cf_qmin">Quantité min.</label><input id="cf_qmin" type="text" inputmode="numeric" data-in="cf" data-ev="input" data-k="qmin" value="${esc(CF.qmin)}"></div><div class="fld" style="justify-content:flex-end"><button class="btn ghost sm" data-act="creset">Réinitialiser</button></div></div></details><div id="cbody"></div></div>`}
function fb(){const c=CF;return S.bottles.filter(b=>{if(c.q&&!norm([b.domaine,b.cuvee,b.appellation,b.millesime,b.region,b.emplacement,b.cepages,b.couleur].join(' ')).includes(norm(c.q)))return false;
 for(const k of ['region','appellation','domaine','millesime','couleur'])if(c[k]!==''&&String(b[k])!==String(c[k]))return false;
 if(c.mat&&mat(b).k!==c.mat)return false;const a=num(b.prixAchat);if(c.pmin!==''&&!(a!=null&&a>=num(c.pmin)))return false;if(c.pmax!==''&&!(a!=null&&a<=num(c.pmax)))return false;if(c.qmin!==''&&bq(b)<(num(c.qmin)||0))return false;return true})}
const tastingsOf=b=>S.tastings.filter(t=>t.bottleId===b.id||(t.snap&&norm(t.snap.domaine)===norm(b.domaine)&&String(t.snap.millesime||'')===String(b.millesime||'')&&norm(t.snap.cuvee||'')===norm(b.cuvee||''))).sort((a,c)=>(c.date||'').localeCompare(a.date||''));
function lastNote(b){const l=tastingsOf(b).filter(t=>t.note!=null&&t.note!=='');return l[0]?l[0].note:null}
const RACH=[['Je rachète','yes'],['À regoûter avant de décider','mid'],['Je ne rachète pas','no']];
const verdictTag=t=>{const r=t&&t.rachat?RACH.find(x=>x[0]===t.rachat):null;return r?`<span class="vd ${r[1]}">${r[1]==='yes'?'♥ ':''}${esc(r[0])}</span>`:''};
const lastVerdict=b=>{const l=tastingsOf(b).find(t=>t.rachat);return l||null};
function miniGauge(b){const f=num(b.gardeFrom),t=num(b.gardeTo);if(f==null||t==null)return'';const y0=Math.min(f,YEAR)-1,y1=Math.max(t,YEAR)+1,x=y=>((y-y0)/(y1-y0)*100).toFixed(1)+'%',k=mat(b).k;return`<div class="gauge" aria-hidden="true"><i style="left:${x(f)};width:${((t-f)/(y1-y0)*100).toFixed(1)}%;background:var(${MAT[k][1]})"></i><b style="left:${x(YEAR)}"></b></div><span class="gl">${f} – ${t}</span>`}
const tile=b=>{const m=mat(b),u=uval(b),n=lastNote(b);return`<article class="tile" data-act="open" data-id="${b.id}" tabindex="0" role="button" aria-label="${esc(b.domaine)} ${esc(b.millesime)}"><div class="tv">${visual(b)}${b.fictive?'<span class="fic">Exemple fictif</span>':''}${n!=null?`<span class="score" title="Ma note">${n}</span>`:''}</div><div class="tb"><h3>${esc(b.domaine)||'Domaine non renseigné'}</h3><p class="cu">${esc(b.cuvee)}</p><p class="ap">${esc(b.appellation)}${b.millesime?' · '+esc(b.millesime):''}</p><div class="meta"><span>${bq(b)} × ${esc(b.format||'75 cl')}</span><span>${u?eur(u.v):'—'}</span></div><span class="tag" style="--c:var(${MAT[m.k][1]})">${MAT[m.k][0]}</span>${miniGauge(b)}</div></article>`};
const byDom=(a,b)=>String(a.domaine).localeCompare(String(b.domaine),'fr')||(num(a.millesime)||0)-(num(b.millesime)||0);
function renderCBody(){const el=$('#cbody');if(!el)return;const l=fb(),s=stats(l);$('#ccount').textContent=`${l.length} référence${l.length>1?'s':''} · ${s.n} bouteille${s.n>1?'s':''}${l.length<S.bottles.length?' (filtrées)':''}`;
 renderRem();
 if(!S.bottles.length){el.innerHTML=`<div class="card"><h2>Votre cave est vide</h2><p class="sub">Ajoutez une première bouteille en photographiant son étiquette, ou importez votre inventaire dans Réglages.</p><p style="margin-top:14px"><button class="btn" data-act="add">Ajouter une bouteille</button></p></div>`;return}
 if(!l.length){el.innerHTML='<p class="sub">Aucune bouteille ne correspond à ces filtres.</p>';return}
 const v=CF.view;
 if(v==='gal')el.innerHTML=`<div class="grid">${l.sort(byDom).map(tile).join('')}</div>`;
 else if(v==='reg'){const g={};l.forEach(b=>(g[b.region||'Région non renseignée']=g[b.region||'Région non renseignée']||[]).push(b));el.innerHTML=Object.keys(g).sort().map(r=>`<section class="reg"><h2>${esc(r)} <small>${g[r].reduce((a,b)=>a+bq(b),0)} bouteilles</small></h2><div class="rack">${g[r].sort(byDom).map(b=>`<button class="spine" data-act="open" data-id="${b.id}" title="${esc(b.domaine)} ${esc(b.cuvee)} ${esc(b.millesime)}">${bq(b)>1?`<em>${bq(b)}</em>`:''}${bottleSVG(b)}<small>${esc(b.millesime||'NV')}</small></button>`).join('')}</div><div class="board"></div></section>`).join('')}
 else if(v==='list')el.innerHTML=`<div class="tw"><table class="lt"><thead><tr><th>Millésime</th><th>Domaine · cuvée</th><th>Appellation</th><th>Format</th><th class="r">Qté</th><th class="r">Achat</th><th class="r">Valeur</th><th>Maturité</th></tr></thead><tbody>${l.sort(byDom).map(b=>{const u=uval(b),m=mat(b);return`<tr data-act="open" data-id="${b.id}" tabindex="0"><td class="yr">${esc(b.millesime||'NV')}</td><td><b>${esc(b.domaine)}</b><small>${esc(b.cuvee)}</small></td><td>${esc(b.appellation)}<small>${esc(b.region)}</small></td><td>${esc(b.format||'75 cl')}</td><td class="r">${bq(b)}</td><td class="r">${num(b.prixAchat)!=null?eur(num(b.prixAchat)):'—'}</td><td class="r">${u?eur(u.v):'—'}</td><td><span class="tag" style="--c:var(${MAT[m.k][1]})">${MAT[m.k][0]}</span></td></tr>`}).join('')}</tbody></table></div>`;
 else if(v==='mil'){const g={};l.forEach(b=>(g[b.millesime||'Sans millésime']=g[b.millesime||'Sans millésime']||[]).push(b));el.innerHTML=Object.keys(g).sort((a,b)=>b-a).map(y=>`<div class="vint"><div class="y">${esc(y)}</div><div class="items">${g[y].sort(byDom).map(b=>`<div class="mini" data-act="open" data-id="${b.id}" tabindex="0" role="button">${bottleSVG(b)}<div><b>${esc(b.domaine)}</b><span>${esc(b.appellation)} · ${bq(b)} bt</span></div></div>`).join('')}</div></div>`).join('')}
 else{const tv=b=>(uval(b)?uval(b).v:0)*bq(b),mx=Math.max(...l.map(tv),1);el.innerHTML=`<div class="tw"><table class="lt"><thead><tr><th>Domaine · cuvée</th><th class="r">Valeur unitaire</th><th class="r">Quantité</th><th class="r">Valeur totale</th><th style="width:28%"></th></tr></thead><tbody>${l.sort((a,b)=>tv(b)-tv(a)).map(b=>{const u=uval(b);return`<tr data-act="open" data-id="${b.id}" tabindex="0"><td><b>${esc(b.domaine)}</b><small>${esc(b.appellation)} ${esc(b.millesime)}${b.cuvee?' · '+esc(b.cuvee):''}</small></td><td class="r">${u?eur(u.v):'—'}${u?`<small>${VT[u.t]}</small>`:''}</td><td class="r">${bq(b)}</td><td class="r">${u?eur(tv(b)):'—'}</td><td><div class="vbar"><i style="width:${tv(b)/mx*100}%"></i></div></td></tr>`}).join('')}</tbody></table></div>`}}
function renderRem(){const e=$('#rem');if(!e)return;const due=S.reminders.filter(r=>r.date<=TODAY);e.innerHTML=due.length?`<div class="banner"><b>Rappels à traiter</b>${due.map(r=>{const b=byId(r.bottleId);return`<div class="row" style="margin-top:6px"><span>${esc(b?b.domaine+' '+(b.millesime||''):'Bouteille supprimée')} — ${esc(r.note||'Vérifier la maturité')} (${fdate(r.date)})</span><button class="lk" data-act="remdone" data-id="${r.id}">Fait</button>${b?`<button class="lk" data-act="open" data-id="${b.id}">Voir</button>`:''}</div>`}).join('')}</div>`:''}

/* ---------- passeport du vin ---------- */
const sec=(t,rows)=>`<section><h4>${t}</h4><dl>${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v===''||v==null||v===false?nr:v}</dd></div>`).join('')}</dl></section>`;
const li=a=>a.length?`<ul class="lst">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
function gardeBar(b){const f=num(b.gardeFrom),t=num(b.gardeTo);if(f==null||t==null)return'';const p=peak(b),y0=Math.min(f,YEAR)-1,y1=Math.max(t,YEAR)+1,x=y=>((y-y0)/(y1-y0)*100).toFixed(2)+'%';
 return`<div class="gb" aria-label="Fenêtre de dégustation"><div class="w" style="left:${x(f)};width:${((t-f)/(y1-y0)*100).toFixed(2)}%"></div>${p?`<div class="pk" style="left:${x(p.a)}"></div><small style="left:${x(p.a)};color:var(--ac)">apogée ${p.a}${p.est?' (estimée)':''}</small>`:''}<div class="nw" style="left:${x(YEAR)}"></div><small style="left:${x(YEAR)};top:-26px">${YEAR}</small></div>`}
function spark(h){h=(h||[]).filter(x=>num(x.v)!=null).sort((a,b)=>a.date.localeCompare(b.date));if(h.length<2)return'<span class="nr">Historique à constituer (une valeur par mise à jour).</span>';const W=300,H=60,mn=Math.min(...h.map(x=>x.v)),mx=Math.max(...h.map(x=>x.v)),r=mx-mn||1,pts=h.map((x,i)=>[8+i/(h.length-1)*(W-16),H-8-(x.v-mn)/r*(H-16)]);
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" width="300" height="60" role="img" aria-label="Évolution de valeur"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="1.6"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?3.5:2}" fill="var(--ac)"/>`).join('')}</svg><span class="src">${fdate(h[0].date)} : ${eur(h[0].v)} → ${fdate(h[h.length-1].date)} : ${eur(h[h.length-1].v)}</span>`}
function avisBlock(b){const l=tastingsOf(b),v=lastVerdict(b),last=l[0];
 if(!last)return`<div class="avis"><h4>Mon avis</h4><p class="empty">Pas encore dégusté. Ouvrez la bouteille ou créez une fiche pour garder votre avis.</p><div class="row"><button class="btn sm" data-act="newtasting" data-id="${b.id}">Remplir une fiche de dégustation</button></div></div>`;
 return`<div class="avis"><h4>Mon avis</h4><div class="row">${v?verdictTag(v):'<span class="vd">Verdict non renseigné</span>'}${last.prixjuge?`<span class="vd">${esc(last.prixjuge)}</span>`:''}<span class="src">${l.length} dégustation${l.length>1?'s':''} · dernière le ${fdate(last.date)}</span></div>${last.texte?`<q>${esc(last.texte.slice(0,220))}</q>`:''}<div class="row"><button class="btn ghost sm" data-act="tview" data-id="${last.id}">Relire ma fiche</button><button class="btn ghost sm" data-act="newtasting" data-id="${b.id}">Nouvelle fiche</button></div></div>`}
function passeport(b){const m=mat(b),u=uval(b),p=peak(b),a=num(b.prixAchat),q=bq(b),ac=accords(b),mil=num(b.millesime),gt=num(b.gardeTo);
 const vrow=t=>{const x=b.val&&b.val[t];return[VT[t],x&&num(x.v)!=null?`${eur(num(x.v))} <span class="src">${x.date?fdate(x.date):'date non renseignée'} · ${x.src?esc(x.src):'source non renseignée'}</span>`:'']};
 return`<div class="pp"><button class="x" data-act="closeSheet">Fermer</button><div class="ppl"><div class="stage">${visual(b)}</div><label class="btn ghost sm" style="background:var(--bg)">${P[b.photo]?'Remplacer la photo':'Ajouter la photo réelle'}<input type="file" accept="image/*" hidden data-in="bphoto" data-id="${b.id}"></label>${b.fictive?'<p class="note" style="color:#252525">Bouteille d’exemple fictive : toutes les données sont inventées pour la démonstration.</p>':''}</div>
<div class="ppr"><p class="sub" style="margin:0">${esc(b.region)}${b.region&&b.couleur?' · ':''}${esc(b.couleur)}</p><h1>${esc(b.domaine)||'Domaine non renseigné'}</h1>${b.cuvee?`<p class="cuv">${esc(b.cuvee)}</p>`:''}<p class="appn">${esc(b.appellation)}${b.millesime?`<b>${esc(b.millesime)}</b>`:''}</p><div class="row" style="margin-top:12px"><span class="tag" style="--c:var(${MAT[m.k][1]})">${MAT[m.k][0]}</span><span class="tag">${q} × ${esc(b.format||'75 cl')}</span>${lastNote(b)!=null?`<span class="big-score" title="Ma dernière note sur 100">${lastNote(b)}</span>`:''}</div>
${avisBlock(b)}
${sec('Identité',[['Domaine',esc(b.domaine)],['Cuvée',esc(b.cuvee)],['Appellation',esc(b.appellation)],['Millésime',esc(b.millesime)],['Cépages',esc(b.cepages)],['Classification',esc(b.classification)],['Terroir',esc(b.terroir)],['Producteur',esc(b.producteur)]])}
${sec('Ma collection',[['Quantité',`${q} × ${esc(b.format||'75 cl')}`],['Date d’achat',b.dateAchat?fdate(b.dateAchat):''],['Prix payé',a!=null?`${eur(a)} par bouteille${q?` <span class="src">${eur(a*q)} pour ${q} bt</span>`:''}`:''],['Provenance',esc(b.provenance)],['État de conservation',esc(b.conservation)],['Emplacement',esc(b.emplacement)],['Notes personnelles',esc(b.notes).replace(/\n/g,'<br>')]])}
${sec('Valorisation',[['Prix d’achat',a!=null?eur(a):''],vrow('marchand'),vrow('enchere'),vrow('revente'),['Plus-value potentielle',u&&a!=null?`<b class="${u.v>=a?'pos':'neg'}">${eur((u.v-a)*q)} (${pc((u.v/a-1)*100)})</b> <span class="src">sur ${VT[u.t].toLowerCase()}, hors frais et fiscalité</span>`:''],['Évolution',spark(b.hist)]])}<p class="note">Trois valeurs distinctes : le prix marchand est un prix affiché, le résultat d’enchères un prix réellement payé à une date donnée, la valeur de revente réaliste ce que vous obtiendriez après frais. Seule la valeur saisie ou importée est affichée.</p>
${b.ai?`<p class="note">Informations de dégustation, de garde et de service complétées par Claude le ${fdate(b.ai.date)} à partir de connaissances générales : à vérifier. Aucun prix n’est estimé automatiquement.</p>`:''}
${sec('Dégustation',[['Profil aromatique',esc(b.aromes)],['Structure',esc(b.structure)],['Acidité',esc(b.acidite)],['Tanins',esc(b.tanins)],['Longueur',esc(b.longueur)],['Potentiel d’évolution',esc(b.evolution)]])}
<section><h4>Garde</h4>${gardeBar(b)}<dl style="margin-top:34px"><div><dt>Fenêtre de dégustation</dt><dd>${b.gardeFrom||b.gardeTo?`${b.gardeFrom||'?'} → ${b.gardeTo||'?'} <span class="src">estimation, dépend du stockage</span>`:nr}</dd></div><div><dt>Année d’apogée</dt><dd>${p?p.a+(p.est?' <span class="src">estimée au milieu de la fenêtre</span>':''):nr}</dd></div><div><dt>Potentiel de vieillissement</dt><dd>${mil&&gt?`${gt-mil} ans depuis la récolte <span class="src">calculé : fin de fenêtre − millésime</span>`:nr}</dd></div><div><dt>Niveau de maturité</dt><dd>${MAT[m.k][0]} <span class="src">en ${YEAR}</span></dd></div></dl></section>
<section><h4>Service</h4><dl>${service(b).map(([k,x])=>`<div><dt>${k}</dt><dd>${esc(x.v)}${x.own?'':' <span class="src">repère général LBC</span>'}</dd></div>`).join('')}</dl></section>
<section><h4>Gastronomie</h4>${ac.u.length?`<p class="subh">Vos accords</p>${li(ac.u)}`:''}<p class="subh">Classiques</p>${li(ac.c)}<p class="subh">Gastronomiques</p>${li(ac.g)}<p class="subh">Pâtisserie</p>${li(ac.p)}<p class="note">Suggestions fondées sur les principes classiques d’accord pour ce type de vin, à confirmer à la dégustation.</p></section>
<section id="mesdeg"><h4>Mes dégustations</h4>${tastingsOf(b).length?`<div class="tsec">${tastingsOf(b).map(t=>`<div class="tmini" data-act="tview" data-id="${t.id}" role="button" tabindex="0"><b>${t.note!=null&&t.note!==''?t.note:'·'}</b><div class="grow"><strong>${fdate(t.date)}</strong>${t.occasion?` · ${esc(t.occasion)}`:''}<small>${esc((t.texte||t.aromes||'').slice(0,110))||'Aucun commentaire'}</small></div>${verdictTag(t)}</div>`).join('')}</div>`:'<p class="note" style="margin:8px 0 12px">Aucune fiche pour ce vin. Notez ce que vous en pensez pour le retrouver au moment de le racheter.</p>'}<button class="btn ghost sm" style="margin:12px 0 6px" data-act="newtasting" data-id="${b.id}">+ Fiche de dégustation</button><p class="note" style="margin:6px 0 0">Cette fiche n’enlève aucune bouteille de la cave. « Ouvrir cette bouteille » en décompte une et ouvre la fiche aussitôt.</p></section>
<div class="actions"><button class="btn" data-act="drink" data-id="${b.id}">Ouvrir cette bouteille</button><button class="btn ghost" data-act="edit" data-id="${b.id}">Modifier</button><button class="btn ghost" data-act="tostudio" data-id="${b.id}">Studio LBC</button><button class="btn ghost" data-act="remind" data-id="${b.id}">Rappel</button><button class="btn danger" data-act="del" data-id="${b.id}">Supprimer</button></div></div></div>`}

function bars(map,total,unit){const e=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=e[0]?e[0][1]:1;return e.length?`<div class="bars">${e.map(([k,v])=>`<div><span>${esc(k)}</span><span class="bb"><i style="width:${v/mx*100}%"></i></span><span>${unit?eur(v):v+' bt'}</span></div>`).join('')}</div>`:'<p class="nr">Aucune donnée.</p>'}
function lineChart(sn){if(sn.length<2)return'<p class="nr">L’historique se construit à chaque mise à jour de la cave. Enregistrez un instantané pour commencer.</p>';const W=620,H=210,L=56,R=14,T=14,B=28,all=sn.flatMap(s=>[s.val,s.inv]),mn=Math.min(...all)*.9,mx=Math.max(...all)*1.05||1,x=i=>L+i/(sn.length-1)*(W-L-R),y=v=>T+(1-(v-mn)/(mx-mn||1))*(H-T-B);
 const pl=k=>sn.map((s,i)=>x(i).toFixed(1)+','+y(s[k]).toFixed(1)).join(' ');const ticks=[mn,(mn+mx)/2,mx];
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Évolution de la valeur">${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--ln)"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${eur(Math.round(t/100)*100)}</text>`).join('')}<polyline points="${pl('inv')}" fill="none" stroke="var(--mu)" stroke-width="1.5" stroke-dasharray="5 4"/><polyline points="${pl('val')}" fill="none" stroke="var(--ac)" stroke-width="2.2"/><circle cx="${x(sn.length-1)}" cy="${y(sn[sn.length-1].val)}" r="4" fill="var(--ac)"/><text x="${L}" y="${H-6}">${fdate(sn[0].date)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fdate(sn[sn.length-1].date)}</text></svg><p class="note">Ligne pleine : valeur estimée. Pointillés : montant investi.${sn.some(s=>s.fictive)?' Les premiers points sont fictifs (démonstration).':''}</p>`}
function vValeur(){const s=stats(),reg={},app={};S.bottles.forEach(b=>{const u=uval(b),v=u?u.v*bq(b):0;if(!v)return;const r=b.region||'Non renseignée',a=b.appellation||'Non renseignée';reg[r]=(reg[r]||0)+v;app[a]=(app[a]||0)+v});
 const prec=[...S.bottles].filter(b=>uval(b)).sort((a,b)=>uval(b).v-uval(a).v).slice(0,6);
 const rev=S.bottles.filter(b=>{const u=uval(b),a=num(b.prixAchat);return u&&a&&bq(b)>0&&u.v/a>=1.2&&['pleine','boire','apres'].includes(mat(b).k)}).sort((a,b)=>uval(b).v/num(b.prixAchat)-uval(a).v/num(a.prixAchat));
 const rv=S.bottles.reduce((a,b)=>{const x=b.val&&b.val.revente;return x&&num(x.v)!=null?a+num(x.v)*bq(b):a},0);
 return`<div class="wrap"><div class="head"><div><h1>La valeur de ma cave</h1><p class="sub">Estimations saisies ou importées, datées et sourcées. Aucune cotation en temps réel.</p></div><div class="row"><button class="btn ghost" data-act="snap">Enregistrer un instantané</button><button class="btn ghost" data-act="goimport">Importer des cotations</button></div></div>
<div class="kpis"><div><small>Investissement total</small><b>${eur(s.inv)}</b></div><div><small>Valorisation actuelle</small><b>${eur(s.val)}</b>${s.unv?`<small>${s.unv} bt sans estimation</small>`:''}</div><div><small>Plus-value latente</small><b class="${s.pv>=0?'pos':'neg'}">${s.base?(s.pv>=0?'+':'')+eur(s.pv):'—'}</b><small>${s.pvp!=null?pc(s.pvp)+' · sur '+eur(s.base)+' investis valorisés':'Prix d’achat et estimation requis'}</small></div><div><small>Revente réaliste saisie</small><b>${rv?eur(rv):'—'}</b><small>${rv?'bouteilles avec une valeur de revente':'à saisir par bouteille'}</small></div></div>
<div class="cols"><div><h2 style="margin-bottom:12px">Évolution historique</h2>${lineChart(S.snaps)}</div><div><h2 style="margin-bottom:12px">Bouteilles les plus précieuses</h2>${prec.length?prec.map(b=>`<div class="mini" style="margin-bottom:8px" data-act="open" data-id="${b.id}" tabindex="0" role="button">${bottleSVG(b)}<div style="flex:1"><b>${esc(b.domaine)} ${esc(b.millesime)}</b><span>${esc(b.appellation)} · ${VT[uval(b).t]}</span></div><b>${eur(uval(b).v)}</b></div>`).join(''):'<p class="nr">Aucune bouteille valorisée.</p>'}</div></div>
<div class="cols"><div><h2 style="margin-bottom:8px">Répartition par région</h2>${bars(reg,s.val,true)}</div><div><h2 style="margin-bottom:8px">Répartition par appellation</h2>${bars(app,s.val,true)}</div></div>
<div class="sec"><h2>Intérêt à la revente</h2>${rev.length?`<div class="tw"><table class="lt"><thead><tr><th>Bouteille</th><th>Maturité</th><th class="r">Achat</th><th class="r">Estimation</th><th class="r">Revente réaliste</th><th class="r">Gain</th></tr></thead><tbody>${rev.map(b=>{const u=uval(b),a=num(b.prixAchat),rr=b.val&&b.val.revente&&num(b.val.revente.v);return`<tr data-act="open" data-id="${b.id}" tabindex="0"><td><b>${esc(b.domaine)} ${esc(b.millesime)}</b><small>${esc(b.appellation)} · ${bq(b)} bt</small></td><td>${MAT[mat(b).k][0]}</td><td class="r">${eur(a)}</td><td class="r">${eur(u.v)}<small>${VT[u.t]}</small></td><td class="r">${rr!=null?eur(rr):'<span class="nr">à saisir</span>'}</td><td class="r pos">${pc((u.v/a-1)*100)}</td></tr>`}).join('')}</tbody></table></div><p class="note">Critère : estimation d’au moins 20 % au-dessus du prix d’achat, bouteille à boire ou à maturité. Un prix marchand n’est pas un prix de revente : renseignez la valeur réaliste pour décider.</p>`:'<p class="nr">Aucune bouteille ne remplit pour l’instant le critère (gain d’au moins 20 % et bouteille prête).</p>'}</div></div>`}

function vCalendrier(){const yrs=[];for(let y=2026;y<=2050;y++)yrs.push(y);const cnt=y=>S.bottles.filter(b=>mat(b,y).k==='pleine').reduce((a,b)=>a+bq(b),0);

const WF=[['domaine','Domaine / château','text'],['cuvee','Cuvée','text'],['appellation','Appellation','text'],['millesime','Millésime','number'],['format','Format','select',FORMATS],['qte','Quantité','number'],['prixDemande','Prix demandé (€ / bouteille)','number'],['prixMax','Prix maximum que je souhaite payer (€)','number'],['marche','Estimation de marché (€ / bouteille)','number'],['marcheSrc','Source de l’estimation','text'],['revente','Valeur de revente réaliste (€)','number'],['livraison','Frais de livraison (€, total)','number'],['statut','Statut de négociation','select',STAT],['lien','Lien de l’annonce','text'],['notes','Notes','area']];
function evalWish(w){const p=num(w.prixDemande),m=num(w.marche),r=num(w.revente),mx=num(w.prixMax),q=num(w.qte)||1,l=num(w.livraison)||0;
 if(p==null)return{k:'nd',t:'Prix demandé manquant',j:'Saisissez le prix affiché pour évaluer l’offre.'};const cost=(p*q+l)/q,tot=p*q+l;
 const out={cost,tot,margin:r!=null?(r-cost)*q:null,marginT:r!=null?'sur la valeur de revente réaliste':null};
 if(m==null)return{...out,k:'nd',t:'Évaluation impossible',j:`Coût total réel ${eur(cost)} par bouteille. Ajoutez une estimation de marché sourcée pour comparer.`};
 const ratio=cost/m;let k=ratio<=.8?'top':ratio<=.95?'bon':ratio<=1.08?'ok':'cher';const js=[`Coût total réel ${eur(cost)} par bouteille (livraison comprise), soit ${Math.round(ratio*100)} % de l’estimation de marché de ${eur(m)}.`];
 if(mx!=null&&cost>mx)js.push(`Au-dessus de votre plafond de ${eur(mx)}.`);
 if(r!=null&&r<cost){js.push(`La valeur de revente réaliste (${eur(r)}) est inférieure au coût : sans intérêt pour la revente.`);if(k==='top'||k==='bon')k='ok'}else if(r!=null)js.push(`Marge potentielle à la revente réaliste : ${eur((r-cost)*q)}.`);else js.push('Sans valeur de revente réaliste, la marge reste théorique : un prix marchand n’est pas un prix de revente.');
 return{...out,k,t:{top:'Excellente affaire',bon:'Prix intéressant',ok:'Prix cohérent',cher:'Trop cher'}[k],j:js.join(' ')}}
const VC={top:'--s-boire',bon:'--s-boire',ok:'--s-surv',cher:'--s-apres',nd:'--s-nd'};

const MSG=[];
function vSommelier(){return`<div class="wrap"><div class="head"><div><h1>Le sommelier privé</h1><p class="sub">Il ne parle que des bouteilles de votre cave, à partir de vos données réelles.</p></div><span class="tag" id="sprov"></span></div><div class="sugg">${['Quelle bouteille ouvrir ce soir avec une côte de bœuf ?','Quels vins sont actuellement à leur apogée ?','Quel Bourgogne dois-je conserver encore dix ans ?','Quelles bouteilles ont le plus pris de valeur ?','Quel vin servir avec un dessert au chocolat ?','Quelle bouteille serait parfaite pour un anniversaire ?'].map(q=>`<button data-act="sq" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div><div class="chat" id="chat"></div><form class="ask" id="askf"><input id="askq" type="text" placeholder="Posez votre question au sommelier" autocomplete="off" aria-label="Question"><button class="btn" type="submit">Demander</button></form></div>`}
async function initSomm(){drawChat();let p='Moteur local';if(AI_ENDPOINT)p='Claude via votre service sécurisé';else try{if(window.claude&&await window.claude.use('sample'))p='Claude'}catch(e){}const e=$('#sprov');if(e)e.textContent=p}

const caveJSON=()=>JSON.stringify(S.bottles.filter(b=>bq(b)>0).map(b=>{const u=uval(b),m=mat(b);return{domaine:b.domaine,cuvee:b.cuvee,appellation:b.appellation,millesime:b.millesime,region:b.region,couleur:b.couleur,quantite:bq(b),format:b.format,prixAchat:num(b.prixAchat),valeur:u?{eur:u.v,type:u.t,date:u.date}:null,fenetre:[b.gardeFrom||null,b.gardeTo||null],apogee:b.apogee||null,maturite:MAT[m.k][0],emplacement:b.emplacement||null,accordsPerso:b.accords||null,fictive:!!b.fictive}}));
const SYS='Tu es le sommelier privé de LIÈGE & BONS COPAINS. Réponds en français, avec élégance et précision, en 6 à 10 phrases maximum. Tu ne peux recommander QUE des bouteilles présentes dans la CAVE JSON ci-dessous, avec quantité > 0. Si aucune ne convient, dis-le franchement et indique la plus proche ou le type de vin à chercher. N’invente jamais de bouteille, de prix, de millésime ni de note. Justifie par la maturité, les accords, le service (température, carafage) et la quantité restante. Les fenêtres de garde sont des estimations. Les bouteilles marquées fictive sont des exemples de démonstration.';
async function askSomm(q){MSG.push({r:'u',t:q});MSG.push({r:'a',t:'…'});drawChat();const i=MSG.length-1;const upd=t=>{MSG[i].t=t;const m=document.querySelectorAll('#chat .msg');if(m.length)m[m.length-1].innerHTML=md(t)};
 const hist=MSG.slice(0,-2).slice(-6).map(m=>(m.r==='u'?'Utilisateur : ':'Sommelier : ')+m.t).join('\n'),prompt=`${SYS}\n\nCAVE JSON :\n${caveJSON()}\n\nÉchanges précédents :\n${hist||'(aucun)'}\n\nQuestion : ${q}`;
 try{if(AI_ENDPOINT){const r=await aiFetch({system:SYS,cave:JSON.parse(caveJSON()),history:hist,question:q});if(!r.ok)throw 0;const j=await r.json();upd(j.text||'…');return}
  const sm=window.claude&&await window.claude.use('sample');if(sm){const r=await sm(prompt,{cache:false,modelTier:'default',onText:({text})=>upd(text)});upd(r.text);return}}catch(e){if(e&&e.code==='not_granted')toast('Accès à Claude refusé : moteur local utilisé')}

const NUMW={un:1,deux:2,trois:3,cinq:5,sept:7,dix:10,quinze:15,vingt:20,trente:30};
const DISH=[[/boeuf|cote de|steak|entrecote|agneau|gigot|grillade|barbecue|carre/,{rougeBx:4,rougeR:3,rougeB:2},'une viande rouge'],[/gibier|chevreuil|canard|biche|lievre|sanglier/,{rougeR:4,rougeB:3,rougeBx:2},'du gibier ou du canard'],[/volaille|poulet|pintade|chapon|dinde|veau/,{rougeB:4,blancB:4,blanc:2,champ:1},'une volaille'],[/poisson|saumon|bar |sole|turbot|cabillaud|thon/,{blancB:4,blanc:4,champ:2},'un poisson'],[/huitre|homard|crevette|coquillage|fruits de mer|saint.jacques|sushi/,{champ:4,blanc:4,blancB:3},'des fruits de mer'],[/foie gras/,{liq:5,champ:2},'du foie gras'],[/chocolat/,{liq:3,rougeR:2,rougeB:1},'un dessert au chocolat'],[/dessert|tarte|gateau|patisserie|fruit|creme|mille.feuille/,{liq:4,champ:3},'un dessert'],[/fromage|comte|roquefort|chevre|camembert/,{rougeB:3,blancB:3,liq:2,rougeBx:2},'des fromages'],[/aperitif|apero/,{champ:5,blanc:3},'l’apéritif'],[/pates|pizza|risotto|lasagne/,{rougeBx:3,rougeR:2,blanc:1},'un plat italien'],[/daube|bourguignon|mijote|ragout|cassoulet/,{rougeR:4,rougeB:3,rougeBx:3},'un plat mijoté']];

function localSomm(q){const t=norm(q),cv=S.bottles.filter(b=>bq(b)>0);if(!cv.length)return'Votre cave est vide pour le moment : ajoutez des bouteilles et je pourrai vous conseiller.';
 if(/anniversaire|celebr|fete|mariage|noel|reveillon|occasion/.test(t)){const l=cv.filter(b=>['pleine','boire'].includes(mat(b).k)).sort((a,b)=>(b.couleur==='effervescent')-(a.couleur==='effervescent')||(uval(b)?uval(b).v:0)-(uval(a)?uval(a).v:0)).slice(0,2);return l.length?`Pour une occasion, je retiens ${l.map(ln).join(' ou ')}. ${l[0].couleur==='effervescent'?'Un effervescent ouvre la fête avec éclat.':'Elle est prête à boire et marquera la table.'} ${MAT[mat(l[0]).k][0]} cette année, selon vos fenêtres de garde.`:'Aucune bouteille n’est encore prête à boire : mieux vaut attendre ou ouvrir un effervescent si vous en achetez un.'}

 if(/conserv|garder|garde|vieillir|encore/.test(t)){const m=/(\d+)\s*ans/.exec(t),w=Object.keys(NUMW).find(k=>new RegExp('\\b'+k+'\\b').test(t)),n=m?+m[1]:w?NUMW[w]:10;const reg=['bourgogne','bordeaux','rhone','champagne'].find(r=>t.includes(r));
  const l=cv.filter(b=>(!reg||norm(b.region+' '+b.appellation).includes(reg))&&num(b.gardeTo)>=YEAR+n).sort((a,b)=>num(b.gardeTo)-num(a.gardeTo)).slice(0,5);return l.length?`Pour garder encore ${n} ans${reg?' en '+reg:''}, je retiens :\n${l.map(b=>`– ${ln(b)} : fenêtre jusqu’en ${b.gardeTo}${b.apogee?', apogée '+b.apogee:''}`).join('\n')}\n\nCes fenêtres sont des estimations qui dépendent de la conservation.`:`Aucune bouteille${reg?' de '+reg:''} n’a une fenêtre renseignée allant au-delà de ${YEAR+n}. Complétez les années de garde dans les fiches.`}
 if(/valeur|plus.?value|cotation|pris de valeur|gagne/.test(t)){const l=cv.map(b=>{const u=uval(b),a=num(b.prixAchat);return u&&a?{b,g:(u.v/a-1)*100,abs:(u.v-a)*bq(b),u}:null}).filter(Boolean).sort((a,b)=>b.g-a.g).slice(0,5);return l.length?`Plus fortes progressions (estimation par rapport au prix payé) :\n${l.map(x=>`– ${ln(x.b)} : ${pc(x.g)}, soit ${eur(x.abs)} (${VT[x.u.t].toLowerCase()}, ${x.u.date?fdate(x.u.date):'sans date'})`).join('\n')}\n\nCe sont des estimations, pas des prix de revente garantis.`:'Je n’ai pas assez de données : il faut un prix d’achat et une estimation par bouteille.'}
 const d=DISH.find(x=>x[0].test(t));if(d){const l=cv.map(b=>({b,s:(d[1][kind(b)]||0)+(d[1][kind(b)]?mscore(b):0)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3);if(!l.length)return`Pour ${d[2]}, aucune bouteille de votre cave ne convient vraiment. Il vous faudrait plutôt ${Object.keys(d[1]).slice(0,2).map(k=>({champ:'un champagne',liq:'un vin liquoreux',rougeBx:'un rouge de Bordeaux',rougeR:'un rouge du Rhône',rougeB:'un Bourgogne rouge',blancB:'un Bourgogne blanc',blanc:'un blanc sec'})[k]).join(' ou ')}.`;
  const b=l[0].b,sv=service(b);return`Pour ${d[2]}, je vous propose ${ln(b)}. ${MAT[mat(b).k][0]} en ${YEAR}${mat(b).k==='cons'||mat(b).k==='surv'?' : un peu tôt, patience conseillée':''}. Service : ${sv[0][1].v}, ${sv[1][1].v.toLowerCase()}.${l[1]?`\n\nAlternative : ${ln(l[1].b)}.`:''}`}
 const s=stats();return`Votre cave compte ${s.n} bouteilles, dont ${s.apo} en pleine maturité en ${YEAR}. Essayez : un plat précis, « quels vins sont à leur apogée ? » ou « quel Bourgogne garder dix ans ? ».`}

const CSVC=['id','domaine','cuvee','appellation','millesime','region','couleur','quantite','format','prixAchat','dateAchat','provenance','conservation','emplacement','gardeFrom','gardeTo','apogee','cepages','classification','terroir','producteur','val.marchand.v','val.marchand.date','val.marchand.src','val.enchere.v','val.enchere.date','val.enchere.src','val.revente.v','val.revente.date','val.revente.src','aromes','structure','acidite','tanins','longueur','evolution','servTemp','servAer','servCar','servVerre','accords','notes'];
const csvq=v=>{v=String(v??'');return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=()=>'﻿'+CSVC.map(c=>c.replace(/\./g,'_')).join(';')+'\n'+S.bottles.map(b=>CSVC.map(c=>csvq(getp(b,c))).join(';')).join('\n');
function parseCSV(t){t=t.replace(/^﻿/,'');const sep=(t.split('\n')[0].match(/;/g)||[]).length>=(t.split('\n')[0].match(/,/g)||[]).length?';':',';const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===sep){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x!==''))rows.push(r);r=[]}else f+=c}r.push(f);if(r.some(x=>x!==''))rows.push(r);const h=rows.shift()||[];return rows.map(x=>Object.fromEntries(h.map((k,i)=>[k.trim(),x[i]])))}
const NUMF=new Set(['millesime','quantite','prixAchat','gardeFrom','gardeTo','apogee','val.marchand.v','val.enchere.v','val.revente.v']);
function importBottlesCSV(txt){const rows=parseCSV(txt);let n=0;rows.forEach(r=>{const o={id:uid(),format:'75 cl'};CSVC.forEach(c=>{if(c==='id')return;const v=r[c.replace(/\./g,'_')]??r[c];if(v!==undefined&&v!=='')setp(o,c,NUMF.has(c)?num(v):v)});if(!o.domaine&&!o.appellation)return;const d=S.bottles.find(x=>dupKey(x)===dupKey(o));if(d)d.quantite=bq(d)+bq(o);else{S.bottles.push(o);n++}});if(S.demo&&n){}return`${n} nouvelle(s) référence(s) importée(s), ${rows.length-n} fusionnée(s) ou ignorée(s).`}
function importQuotes(txt){const rows=parseCSV(txt);let ok=0,ko=0;rows.forEach(r=>{const k=norm(r.domaine)+'|'+norm(r.cuvee)+'|'+(r.millesime||'');const b=S.bottles.find(x=>norm(x.domaine)+'|'+norm(x.cuvee)+'|'+(x.millesime||'')===k);const v=num(r.valeur),t=norm(r.type||'marchand').replace('encheres','enchere');if(!b||v==null||!VT[t]){ko++;return}b.val=b.val||{};b.val[t]={v,date:r.date||TODAY,src:r.source||'Import CSV'};b.hist=(b.hist||[]).concat({date:r.date||TODAY,v,src:r.source||'Import CSV'});ok++});touchSnap();return`${ok} cotation(s) importée(s), ${ko} ligne(s) non reconnue(s).`}
function vReglages(){const pers=!!IDB.db;return`<div class="wrap"><div class="head"><div><h1>Réglages</h1><p class="sub">Sauvegarde, import et apparence.</p></div></div>
<div class="cols"><div class="sec"><h2>Apparence</h2><div class="seg">${[['auto','Automatique'],['light','Clair'],['dark','Sombre']].map(([k,l])=>`<button data-act="theme" data-k="${k}" class="${S.settings.theme===k?'on':''}">${l}</button>`).join('')}</div></div>
<div class="sec"><h2>Persistance</h2><p>Les données sont enregistrées sur cet appareil (${pers?'base IndexedDB':'stockage limité'}), photos comprises. Dernière sauvegarde locale : <span id="savedat">${S.savedAt?new Date(S.savedAt).toLocaleString('fr-FR'):'—'}</span>.</p><p class="note">Pensez à exporter une sauvegarde JSON régulièrement : effacer les données du navigateur supprimerait la cave.</p></div></div>

<div class="sec"><h2>Collection de démonstration</h2><p>${S.bottles.some(b=>b.fictive)||S.tastings.some(t=>t.fictive)||S.wishes.some(w=>w.fictive)?'Des exemples fictifs sont présents.':'Aucun exemple fictif.'}</p><p style="margin-top:10px"><button class="btn danger" data-act="clrdemo">Supprimer tous les exemples fictifs</button></p></div>

function exportJSON(){const photos={};Object.keys(P).forEach(k=>photos[k]=P[k]);return JSON.stringify({app:'lbc-cave-privee',version:1,exported:new Date().toISOString(),state:S,photos})}
